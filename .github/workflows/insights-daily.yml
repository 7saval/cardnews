name: insights-daily

# 매일 KST 00:30에 "어제(KST)" 하루치 인스타 인사이트를 Supabase daily_insights에 적재.
# 수동 실행 시 date 입력으로 특정 날짜 재수집 가능.
on:
  schedule:
    - cron: '30 15 * * *' # UTC 15:30 = KST 00:30
  workflow_dispatch:
    inputs:
      date:
        description: '재수집할 날짜 (YYYY-MM-DD, KST). 비우면 어제'
        required: false

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/insights-collector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/insights-collector/package-lock.json

      - run: npm ci

      - name: Collect daily insights
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            npm run collect -- --date "$INPUT_DATE"
          else
            npm run collect
          fi
