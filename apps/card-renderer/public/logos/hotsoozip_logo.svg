<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 680" width="680" height="680">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d5e" />
      <stop offset="0.55" stop-color="#ff6f3c" />
      <stop offset="1" stop-color="#ff9a1f" />
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4d5e" />
      <stop offset="1" stop-color="#ff8a1f" />
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 배지 바탕: 풀블리드 그라디언트 + 흰 링 (카드에서 원형으로 잘려 쓰인다) -->
  <rect width="680" height="680" fill="url(#bg)" />
  <circle cx="340" cy="340" r="322" fill="none" stroke="#ffffff" stroke-width="14" />
  <circle cx="340" cy="340" r="315" fill="url(#shine)" />

  <!-- 북마크(수집) -->
  <path
    d="M269 78 h142 a24 24 0 0 1 24 24 v274 l-95 -60 l-95 60 v-274 a24 24 0 0 1 24 -24 z"
    fill="#ffffff"
  />

  <!-- 불꽃(핫한 소식) -->
  <g transform="translate(275 108) scale(1.3)">
    <path
      d="M50 0 C58 22 88 40 88 78 C88 108 70 128 50 128 C30 128 12 108 12 78 C12 60 22 48 30 38 C32 52 38 58 44 58 C40 38 42 18 50 0 Z"
      fill="url(#flame)"
    />
    <path
      d="M50 72 C58 85 66 93 66 105 C66 116 58 122 50 122 C42 122 34 116 34 105 C34 93 44 85 50 72 Z"
      fill="#ffffff"
    />
  </g>

  <!-- 워드마크 -->
  <text
    x="340"
    y="528"
    text-anchor="middle"
    font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif"
    font-weight="900"
    font-size="124"
    letter-spacing="4"
    fill="#ffffff"
  >핫수집</text>
  <text
    x="340"
    y="586"
    text-anchor="middle"
    font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif"
    font-weight="700"
    font-size="40"
    letter-spacing="5"
    fill="#ffffff"
  >HOT-SOOZIP</text>
</svg>
